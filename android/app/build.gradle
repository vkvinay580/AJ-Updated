plugins { id 'com.android.application' }

def websiteUrl = providers.gradleProperty('websiteUrl').getOrElse('https://aryangold.in')
if (websiteUrl && !(websiteUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/?/)) {
    throw new GradleException('websiteUrl must be an HTTPS origin, e.g. https://your-domain.com')
}

android {
    namespace 'com.aryangold.suite'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aryangold.suite'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'WEBSITE_URL', '"' + websiteUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            def debugWebsiteUrl = providers.gradleProperty('debugWebsiteUrl').getOrElse(websiteUrl)
            if (!(debugWebsiteUrl ==~ /https?:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/?/)) {
                throw new GradleException('debugWebsiteUrl must be an HTTP or HTTPS origin')
            }
            buildConfigField 'String', 'WEBSITE_URL', '"' + debugWebsiteUrl + '"'
        }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
